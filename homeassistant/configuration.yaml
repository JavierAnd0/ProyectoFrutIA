# Configuración mínima de FruitAI. HA crea el resto de archivos al arrancar.
# El broker MQTT NO se configura aquí: se agrega desde la interfaz
# (Ajustes → Dispositivos y servicios → MQTT), broker "mosquitto", puerto 1883.
default_config:

automation: !include automations.yaml

# Acceso por HTTPS con Tailscale (`tailscale serve --bg 8123`): Tailscale reenvía las
# peticiones a HA, y HA solo las acepta si confía en quien las reenvía. Son direcciones
# internas: el propio equipo y las redes de Docker (en el Mac, Docker Desktop usa
# 192.168.65.0/24; en Linux, 172.16.0.0/12).
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
    - 172.16.0.0/12
    - 192.168.65.0/24

# Panel FruitAI (YAML, versionado en git): stock, salidas, ambiente y botones de prueba.
lovelace:
  dashboards:
    fruitai-panel:
      mode: yaml
      title: FruitAI
      icon: mdi:fruit-cherries
      show_in_sidebar: true
      filename: dashboards/fruitai.yaml

# Controles para simular al ESP32 desde la interfaz (pruebas y demo sin hardware).
input_select:
  fruitai_fruta:
    name: Fruta
    icon: mdi:fruit-cherries
    options: [manzana, pera, banano, kiwi]

input_number:
  fruitai_cantidad:
    name: Cantidad
    icon: mdi:counter
    min: 1
    max: 10
    step: 1
    mode: box

# Publica en fruitai/movimiento lo mismo que publicaría el ESP32, así el
# servicio lo trata igual (SQLite, stock, avisos). Solo para pruebas.
script:
  fruitai_simular_movimiento:
    alias: Simular movimiento del ESP32
    icon: mdi:swap-vertical
    mode: queued
    fields:
      tipo:
        description: entrada o salida
        example: entrada
    sequence:
      - action: mqtt.publish
        data:
          topic: fruitai/movimiento
          qos: 1
          payload: >
            {{ {"fruta": states('input_select.fruitai_fruta'),
                "tipo": tipo,
                "cantidad": states('input_number.fruitai_cantidad') | int(1),
                "evento_id": "ha-" ~ (now().timestamp() * 1000) | int} | to_json }}

  # Notificación push a todos los celulares con la app de Home Assistant (Companion).
  # Cada celular registra una acción notify.mobile_app_<nombre>; aquí se recorren las
  # entidades de la integración mobile_app para no tener que escribir el nombre a mano.
  fruitai_notificar_celulares:
    alias: Notificar a los celulares (FruitAI)
    icon: mdi:cellphone-message
    mode: queued
    fields:
      titulo:
        example: FruitAI
      mensaje:
        example: Se acabaron los bananos
    sequence:
      - repeat:
          for_each: >
            {{ integration_entities('mobile_app') | select('match', 'device_tracker\\.')
               | map('replace', 'device_tracker.', '') | list }}
          sequence:
            - action: "notify.mobile_app_{{ repeat.item }}"
              continue_on_error: true
              data:
                title: "{{ titulo }}"
                message: "{{ mensaje }}"

# Respuestas de las oraciones locales (custom_sentences/es/fruitai.yaml).
# Leen los sensores que publica el servicio: no calculan nada.
intent_script:
  FruitaiStock:
    speech:
      text: >
        {% set n = states('sensor.fruitai_stock_' ~ fruta) %}
        {% if n in ['unknown', 'unavailable'] %}No tengo el dato de {{ fruta }} en este momento.
        {% elif n | int(0) == 1 %}Hay 1 {{ fruta }}.
        {% else %}Hay {{ n }} {{ fruta }}s.{% endif %}

  FruitaiSalidas:
    speech:
      text: >
        {% set n = states('sensor.fruitai_salidas_' ~ periodo ~ '_' ~ fruta) %}
        {% set cuando = 'Hoy' if periodo == 'hoy' else 'Esta semana' %}
        {% if n in ['unknown', 'unavailable'] %}No tengo el dato de salidas de {{ fruta }} en este momento.
        {% elif n | int(0) == 1 %}{{ cuando }} salió 1 {{ fruta }}.
        {% else %}{{ cuando }} salieron {{ n }} {{ fruta }}s.{% endif %}

  FruitaiAmbiente:
    speech:
      text: >
        {% set t = states('sensor.fruitai_temperatura_frutero') %}
        {% set h = states('sensor.fruitai_humedad_frutero') %}
        {% if t in ['unknown', 'unavailable'] %}No tengo la temperatura del frutero en este momento.
        {% else %}El frutero está a {{ t }} °C con {{ h }} % de humedad.{% endif %}

  FruitaiInventario:
    speech:
      text: >
        {% set ns = namespace(partes=[]) %}
        {% for f in ['manzana', 'pera', 'banano', 'kiwi'] %}
          {% set n = states('sensor.fruitai_stock_' ~ f) | int(0) %}
          {% set ns.partes = ns.partes + [n ~ ' ' ~ (f if n == 1 else f ~ 's')] %}
        {% endfor %}
        Hay {{ ns.partes[:-1] | join(', ') }} y {{ ns.partes[-1] }}.
