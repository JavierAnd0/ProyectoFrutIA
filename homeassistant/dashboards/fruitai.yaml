# Panel FruitAI. Se edita aquí (modo YAML) y queda versionado en git.
views:
  - title: Inventario
    path: inventario
    icon: mdi:fruit-cherries
    cards:
      # Registro con la cámara: + / − registran la fruta que confirmó el ESP32 (misma lógica
      # anti-duplicados que los botones físicos). La imagen solo llega si el ESP32 la manda.
      - type: vertical-stack
        cards:
          - type: picture-entity
            entity: camera.fruitai_camara
            name: Cámara de la estación
            show_state: false
            # "live": muestra cada foto apenas llega. Sin esto la tarjeta pide una imagen
            # nueva solo cada ~10 s y se ve muy atrasada.
            camera_view: live
          - type: entities
            entities:
              - entity: sensor.fruitai_fruta_detectada
                name: Fruta detectada
              - entity: sensor.fruitai_estado_deteccion
                name: Estado
          - type: horizontal-stack
            cards:
              - type: button
                entity: button.fruitai_registrar_entrada
                name: Entrada
                icon: mdi:plus-circle
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.fruitai_registrar_entrada
              - type: button
                entity: button.fruitai_registrar_salida
                name: Salida
                icon: mdi:minus-circle
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.fruitai_registrar_salida

      - type: glance
        title: Stock actual
        columns: 4
        entities:
          - entity: sensor.fruitai_stock_manzana
            name: Manzana
            icon: mdi:food-apple
          - entity: sensor.fruitai_stock_pera
            name: Pera
            icon: mdi:fruit-pear
          - entity: sensor.fruitai_stock_banano
            name: Banano
            icon: mdi:fruit-watermelon
          - entity: sensor.fruitai_stock_kiwi
            name: Kiwi
            icon: mdi:fruit-citrus

      - type: vertical-stack
        cards:
          - type: entities
            title: Registro manual (elegir fruta, sin cámara)
            entities:
              - input_select.fruitai_fruta
              - input_number.fruitai_cantidad
          - type: horizontal-stack
            cards:
              - type: button
                name: Entrada
                icon: mdi:plus-circle
                tap_action:
                  action: perform-action
                  perform_action: script.fruitai_simular_movimiento
                  data:
                    tipo: entrada
              - type: button
                name: Salida
                icon: mdi:minus-circle
                tap_action:
                  action: perform-action
                  perform_action: script.fruitai_simular_movimiento
                  data:
                    tipo: salida

      - type: glance
        title: Dispositivo
        entities:
          - entity: binary_sensor.fruitai_esp32_conectado
            name: ESP32
          # Temperatura y humedad del frutero (DHT22): mejora futura, ver docs/mejoras_futuras.md

      - type: entities
        title: Salidas
        entities:
          - type: section
            label: Hoy
          - entity: sensor.fruitai_salidas_hoy_manzana
            name: Manzana
          - entity: sensor.fruitai_salidas_hoy_pera
            name: Pera
          - entity: sensor.fruitai_salidas_hoy_banano
            name: Banano
          - entity: sensor.fruitai_salidas_hoy_kiwi
            name: Kiwi
          - type: section
            label: Esta semana (lunes a hoy)
          - entity: sensor.fruitai_salidas_semana_manzana
            name: Manzana
          - entity: sensor.fruitai_salidas_semana_pera
            name: Pera
          - entity: sensor.fruitai_salidas_semana_banano
            name: Banano
          - entity: sensor.fruitai_salidas_semana_kiwi
            name: Kiwi
